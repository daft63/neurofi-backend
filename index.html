<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroFi.AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: white;
      text-align: center;
    }
    header, section, footer {
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    .btn {
      background: #00ffc3;
      color: #000;
      padding: 1rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
      margin-top: 1rem;
    }
    .chat-container {
      background-color: #1a1a1a;
      border-radius: 12px;
      padding: 1.5rem;
      width: 90%;
      max-width: 600px;
      margin: 2rem auto;
      text-align: left;
    }
    .chat-log {
      background: #0f0f0f;
      border-radius: 8px;
      padding: 1rem;
      height: 250px;
      overflow-y: auto;
      margin-bottom: 1rem;
    }
    .chat-input {
      display: flex;
    }
    .chat-input input {
      flex: 1;
      padding: 0.75rem;
      border-radius: 6px;
      border: none;
      margin-right: 0.5rem;
      font-size: 1rem;
    }
    .chat-input button {
      padding: 0.75rem 1rem;
      background: #00ffc3;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .chat-input button:disabled {
      background: #888;
      cursor: not-allowed;
    }
    .roadmap {
      text-align: left;
      max-width: 600px;
      margin: 2rem auto;
    }
    .roadmap h2 {
      color: #00ffc3;
    }
    .partner-logos {
      margin-top: 3rem;
    }
    .partner-logos img {
      height: 40px;
      margin: 0 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>NeuroFi.AI</h1>
    <p>Decentralized Intelligence for Everyone</p>
    <button class="btn" onclick="document.getElementById('chat').scrollIntoView({behavior: 'smooth'})">🚀 Launch App</button>
  </header>

  <section class="chat-container" id="chat">
    <h2>Talk to Our Crypto AI</h2>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Ask me anything about crypto...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </section>

  <section class="roadmap">
    <h2>🚧 Roadmap</h2>
    <ul>
      <li><strong>Q1:</strong> Copy trading AI, community growth.</li>
      <li><strong>Q2:</strong> Token creation tool, partner expansion.</li>
      <li><strong>Q3:</strong> Governance voting & rewards.</li>
      <li><strong>Q4:</strong> Full AI trading automation & mobile DApp.</li>
    </ul>
  </section>

  <footer>
    <div class="partner-logos">
      <img src="https://logovtor.com/wp-content/uploads/2021/06/anthropic-ai-logo-vector.png" alt="Anthropic">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/EleutherAI_logo.svg/640px-EleutherAI_logo.svg.png" alt="EleutherAI">
    </div>
    <p style="color: #888; margin-top: 2rem;">© 2025 NeuroFi.AI</p>
  </footer>

  <script>
    function sanitizeInput(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const log = document.getElementById('chat-log');
      const button = document.querySelector('.chat-input button');
      const message = input.value.trim();

      if (!message) return;

      log.innerHTML += `<div><strong>You:</strong> ${sanitizeInput(message)}</div>`;
      input.value = '';
      button.disabled = true;
      button.textContent = 'Loading...';

      try {
        const response = await fetch('http://localhost:3000/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });

        const data = await response.json();
        const reply = data.reply || 'Sorry, I could not respond.';
        log.innerHTML += `<div><strong>AI:</strong> ${sanitizeInput(reply)}</div>`;
      } catch (error) {
        console.error('Error:', error);
        log.innerHTML += `<div style="color:red;"><strong>Error:</strong> ${sanitizeInput(error.message)}</div>`;
      } finally {
        button.disabled = false;
        button.textContent = 'Send';
        log.scrollTop = log.scrollHeight;
      }
    }

    document.getElementById('user-input').addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
